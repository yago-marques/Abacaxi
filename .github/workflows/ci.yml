name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install tools
        run: brew install xcodegen swiftgen swiftlint

      - name: Bootstrap
        run: make bootstrap

      - name: Generate localizations
        run: make generate-localizations

      - name: Generate Xcode project
        run: make generate

      - name: Lint (strict)
        run: make lint-strict

      - name: Test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            make test-impacted BASE_REF="origin/${{ github.base_ref }}" TEST_DESTINATION='platform=iOS Simulator,name=iPhone 16'
          else
            make test TEST_DESTINATION='platform=iOS Simulator,name=iPhone 16'
          fi

      - name: Publish test report
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash Scripts/publish-test-report.sh build/test-results

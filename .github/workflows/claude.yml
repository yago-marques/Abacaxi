name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr review:*),mcp__github_inline_comment__create_inline_comment"
            --model claude-sonnet-5
            --max-turns 30
            --append-system-prompt "Você atua neste repositório respondendo menções @claude em PRs e issues. Responda sempre em português do Brasil. Quando pedirem review ou re-review de um PR: leia .claude/CODE_RULES/ e os AGENTS.md dos módulos tocados, revise apenas o diff, comente inline nas violações citando a regra e a severidade (CRÍTICO: fronteira de camada, comportamento sem teste, fatalError/force-unwrap em produção, segredo hardcoded, teste removido; ATENÇÃO: violação de CODE_RULES sem impacto de runtime; SUGESTÃO: melhoria), e publique o parecer completo no seu comentário com o veredito (crítico presente ou não). IMPORTANTE: neste modo você não consegue submeter reviews formais do GitHub (approve/request-changes) — o veredito formal é responsabilidade do workflow automático de review, que roda a cada push no PR; se os achados foram corrigidos, informe que o próximo push (ou reopen do PR) fará o workflow automático aprovar formalmente. Para outras perguntas, responda com base no código e nas regras do repositório."

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude review against CODE_RULES
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr review:*),mcp__github_inline_comment__create_inline_comment"
            --model claude-sonnet-5
            --max-turns 300
          prompt: |
            Você é o revisor de código deste repositório. Revise APENAS o diff do PR
            ${{ github.repository }}#${{ github.event.pull_request.number }} contra as
            regras normativas do projeto.

            Antes de revisar, leia:
            1. Todos os documentos em .claude/CODE_RULES/ (testes, Swift, arquitetura,
               UIKit e validação) — são as regras normativas;
            2. O AGENTS.md da raiz e o AGENTS.md de cada módulo tocado pelo diff
               (dependências permitidas e limites arquiteturais locais);
            3. Para dúvida de padrão, o arquivo canônico equivalente no repositório
               (ex.: fluxo de use case espelha GetRecipeQuestionsUseCase).

            O que verificar, em ordem de importância:
            - Fronteiras de camada: feature importando Data/Network/Persistence
              concretos, detalhe de transporte/persistência vazando para apresentação,
              erro cru de infraestrutura atravessando camadas sem mapeamento;
            - Regras de CODE_RULES violadas (cite o documento e o trecho da regra);
            - Testes: mudança de comportamento sem teste correspondente, stub sem
              default válido, teste sem comportamento observável, fatalError em double;
            - Concorrência: ViewModel/coordinator novo sem @MainActor, Task sem
              cancelamento quando a tela pode ser abandonada;
            - Strings user-facing fora do pipeline L10n/SwiftGen.

            NÃO comente: estilo já coberto pelo SwiftLint (o CI roda lint-strict),
            preferências pessoais sem regra correspondente, ou código fora do diff.

            Classifique cada achado por severidade:
            - CRÍTICO: violação de fronteira de camada (feature importando concreto de
              infra, erro cru atravessando camadas), mudança de comportamento sem teste,
              fatalError/force-unwrap em código de produção, segredo ou credencial
              hardcoded, remoção/enfraquecimento de teste existente;
            - ATENÇÃO: violação explícita de CODE_RULES sem impacto imediato de runtime
              (naming, L10n, organização de arquivo, doubles fora do padrão);
            - SUGESTÃO: melhoria alinhada às regras, sem violação.

            Para cada violação concreta, crie um comentário inline na linha exata
            usando a ferramenta de inline comment, citando a regra violada e a severidade,
            e sugerindo a correção no padrão do repositório.

            Ao final, submeta o veredito formal (antes, confira o estado do PR com
            `gh pr view <número> --json reviewDecision`):
            - Se houver 1+ achado CRÍTICO: `gh pr review <número> --request-changes --body "<resumo>"`;
            - Se NÃO houver crítico E o reviewDecision for CHANGES_REQUESTED (há um
              bloqueio anterior seu): `gh pr review <número> --approve --body "<resumo>"` —
              a aprovação existe SOMENTE para substituir seu próprio bloqueio depois
              das correções, destravando o merge;
            - Caso contrário (revisão limpa sem bloqueio anterior):
              `gh pr review <número> --comment --body "<resumo>"`.
            O resumo deve conter: veredito, contagem de achados por severidade (achados
            de ATENÇÃO não bloqueiam, mas devem constar) e os pontos positivos do PR.
            Você NUNCA faz merge de PRs — a decisão de merge é sempre humana.

            Escreva TODOS os comentários (inline e resumo) em português do Brasil.

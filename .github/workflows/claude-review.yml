name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude review against CODE_RULES
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --model claude-sonnet-5
            --max-turns 30
          prompt: |
            Você é o revisor de código deste repositório. Revise APENAS o diff do PR
            ${{ github.repository }}#${{ github.event.pull_request.number }} contra as
            regras normativas do projeto.

            Antes de revisar, leia:
            1. Todos os documentos em .claude/CODE_RULES/ (testes, Swift, arquitetura,
               UIKit e validação) — são as regras normativas;
            2. O AGENTS.md da raiz e o AGENTS.md de cada módulo tocado pelo diff
               (dependências permitidas e limites arquiteturais locais);
            3. Para dúvida de padrão, o arquivo canônico equivalente no repositório
               (ex.: fluxo de use case espelha GetRecipeQuestionsUseCase).

            O que verificar, em ordem de importância:
            - Fronteiras de camada: feature importando Data/Network/Persistence
              concretos, detalhe de transporte/persistência vazando para apresentação,
              erro cru de infraestrutura atravessando camadas sem mapeamento;
            - Regras de CODE_RULES violadas (cite o documento e o trecho da regra);
            - Testes: mudança de comportamento sem teste correspondente, stub sem
              default válido, teste sem comportamento observável, fatalError em double;
            - Concorrência: ViewModel/coordinator novo sem @MainActor, Task sem
              cancelamento quando a tela pode ser abandonada;
            - Strings user-facing fora do pipeline L10n/SwiftGen.

            NÃO comente: estilo já coberto pelo SwiftLint (o CI roda lint-strict),
            preferências pessoais sem regra correspondente, ou código fora do diff.

            Para cada violação concreta, crie um comentário inline na linha exata
            usando a ferramenta de inline comment, citando a regra violada e sugerindo
            a correção no padrão do repositório. Ao final, publique um comentário de
            resumo com: veredito geral, contagem de achados por severidade e os pontos
            positivos do PR. Se não houver violações, publique apenas o resumo dizendo
            que o PR segue as regras.

            Escreva TODOS os comentários (inline e resumo) em português do Brasil.

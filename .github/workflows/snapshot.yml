# Regressão visual do DesignSystem.
#
# Ambiente canônico dos snapshots: iPhone 16 / iOS 18.5 / Xcode 16.4 (pinados
# abaixo). Os testes só executam de verdade com SNAPSHOT_TESTS=1 — em qualquer
# outra suíte (AllTests, test-impacted, hook local) eles dão skip, então este
# workflow é o único lugar onde snapshots falham ou são gravados.
#
# Para (re)gravar referências, use Scripts/record-snapshots.sh (automatiza o
# ciclo inteiro) ou manualmente:
#   - push da sua branch para uma branch record/* (funciona antes do merge):
#       git push -f origin HEAD:record/minha-branch
#   - ou Actions → Snapshot Tests → Run workflow com record=all
#     (workflow_dispatch exige o arquivo na branch default)
#   Depois: baixe o artifact "ds-snapshot-references", `tar -xzf` na raiz do
#   repo e commite as pastas __Snapshots__/.
#
# Sem nenhuma __Snapshots__/ commitada, runs de PR pulam a comparação com um
# aviso (bootstrap) em vez de falhar por referência ausente.
name: Snapshot Tests

on:
  pull_request:
    paths:
      - "Modules/DesignSystem/**"
      - ".github/workflows/snapshot.yml"
      - "project.yml"
      - "Makefile"
  push:
    branches: ["record/**"]
  workflow_dispatch:
    inputs:
      record:
        description: "Modo de gravação das referências"
        type: choice
        options: ["never", "missing", "all"]
        default: "never"

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: DS Snapshots
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Determine mode
        id: mode
        run: |
          RECORD='never'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RECORD='${{ inputs.record }}'
          fi
          case "${{ github.ref_name }}" in record/*) RECORD='all';; esac
          RUN='true'
          if [ "$RECORD" = 'never' ] && \
             ! find Modules/DesignSystem/Tests -type d -name __Snapshots__ | grep -q .; then
            RUN='false'
            echo "::notice::Nenhuma __Snapshots__/ commitada ainda — comparação pulada (bootstrap). Grave com Scripts/record-snapshots.sh."
          fi
          echo "record=$RECORD" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.mode.outputs.run == 'true'
        with:
          xcode-version: "16.4"

      - name: Install tooling
        if: steps.mode.outputs.run == 'true'
        run: brew install xcodegen swiftgen

      - name: Bootstrap
        if: steps.mode.outputs.run == 'true'
        run: make bootstrap

      - name: Generate localizations
        if: steps.mode.outputs.run == 'true'
        run: make generate-localizations

      - name: Generate project
        if: steps.mode.outputs.run == 'true'
        run: make generate

      # Em modo record os asserts falham por design ("Record mode is on") —
      # o passo seguinte empacota as referências mesmo assim (if: always()).
      - name: Run snapshot tests
        if: steps.mode.outputs.run == 'true'
        env:
          TEST_RUNNER_SNAPSHOT_TESTS: "1"
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: ${{ steps.mode.outputs.record }}
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/build/snapshot-failures
        run: |
          make test \
            TEST_SCHEME=DesignSystemTests \
            TEST_DESTINATION='platform=iOS Simulator,name=iPhone 16,OS=18.5'

      # tar preserva os caminhos completos a partir da raiz do repo — o
      # upload-artifact sozinho corta tudo antes do primeiro wildcard.
      - name: Package recorded references
        if: always() && steps.mode.outputs.record != 'never'
        run: |
          find Modules/DesignSystem/Tests -type d -name __Snapshots__ -print0 \
            | xargs -0 tar -czf ds-snapshot-references.tgz

      - name: Upload recorded references
        if: always() && steps.mode.outputs.record != 'never'
        uses: actions/upload-artifact@v4
        with:
          name: ds-snapshot-references
          path: ds-snapshot-references.tgz
          if-no-files-found: error

      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ds-snapshot-failures
          path: build/snapshot-failures/
          if-no-files-found: ignore

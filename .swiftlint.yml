excluded:
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"
  - "Abacaxi.xcodeproj"

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

force_unwrapping:
  severity: error

implicitly_unwrapped_optional:
  severity: error

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

type_name:
  excluded:
    - ID

trailing_whitespace:
  ignores_empty_lines: false
